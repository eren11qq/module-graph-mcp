<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Module Graph</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
    }
    .card {
      max-width: 560px;
      padding: 40px 48px;
      border: 1px solid #21262d;
      border-radius: 16px;
      background: #161b22;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: .3px; }
    .sub { color: #8b949e; font-size: 13px; margin-bottom: 24px; }
    .row { display: flex; gap: 10px; font-size: 14px; line-height: 2; }
    .key { color: #8b949e; width: 130px; flex: none; }
    .val { word-break: break-all; }
    code { background: #0d1117; padding: 2px 6px; border-radius: 4px; color: #79c0ff; }
    .dot {
      display: inline-block; width: 9px; height: 9px; border-radius: 50%;
      background: #3fb950; margin-right: 8px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .35; } }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="dot"></span>Module Graph</h1>
    <div class="sub">实时模块依赖仪表盘 · 骨架运行中（Ticket 01）</div>
    <div class="row"><span class="key">监视目录</span><span class="val" id="root">…</span></div>
    <div class="row"><span class="key">服务端口</span><span class="val" id="port">…</span></div>
    <div class="row"><span class="key">MCP 工具</span><span class="val"><code>get_module_graph</code></span></div>
    <div class="row"><span class="key">版本</span><span class="val" id="version">…</span></div>
    <div class="sub" style="margin-top:20px">
      依赖图渲染将在后续工单上线：灰=未测 / 黄=有测试未跑 / 绿=通过 / 红=失败
    </div>
  </div>
  <script type="module" src="./skeleton.js"></script>
</body>
</html>
