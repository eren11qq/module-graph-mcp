<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Module Graph</title>
</head>
<body data-theme="dark">
  <!-- 全屏仪器盘壳层（theme.html 定稿）：stage 打底，顶栏 / 左右坞 / 状态栏悬浮 -->
  <div id="stage">
    <div id="cy" aria-label="模块依赖图画布"></div>
  </div>

  <header id="topbar" class="overlay">
    <div class="brand"><span class="logo"></span>模块图谱<span class="sub">MODULE GRAPH</span></div>
    <div class="tools">
      <input type="search" id="search-box" placeholder="搜索：路径 / 文件名" aria-label="搜索模块" />
      <button type="button" id="btn-untested-only" class="tool-toggle" title="只显示未测模块（灰球）">只看未测</button>
      <button type="button" id="btn-collapse" class="tool-toggle" title="同目录文件 ≥ 3 个时折叠为一个目录球；点目录球展开该目录">目录折叠</button>
      <button type="button" id="btn-reset" class="tool-toggle" title="缩放/平移复位到全图">重置视图</button>
    </div>
    <div class="spacer"></div>
    <button type="button" id="btn-theme" class="tool-toggle theme-btn" title="切换暗色仪器盘 / 亮色工作台（记忆于 localStorage）">亮色工作台</button>
    <div class="conn" id="conn"><span class="dot"></span><span id="conn-txt">连接中…</span></div>
  </header>

  <aside id="dock-left" class="overlay">
    <div class="card">
      <h2>状态过滤</h2>
      <div id="legend"></div>
    </div>
    <div class="card" id="tuning-card">
      <h2>布局力</h2>
      <!-- 四力滑杆 (Code-review 2026-08-29): 语义借 Obsidian,过程不借 ——
           每次重排都从当前位置出发,仅由用户松手(change)触发。范围与步长
           由 main.ts 按 THEME.TUNING_RANGES 注入。 -->
      <div class="tuning-row">
        <label for="tune-gravity">中心引力</label>
        <input type="range" id="tune-gravity" aria-label="中心引力" />
        <output id="tune-gravity-val"></output>
      </div>
      <div class="tuning-row">
        <label for="tune-nodeRepulsion">球间斥力</label>
        <input type="range" id="tune-nodeRepulsion" aria-label="球间斥力" />
        <output id="tune-nodeRepulsion-val"></output>
      </div>
      <div class="tuning-row">
        <label for="tune-edgeElasticity">连接弹性</label>
        <input type="range" id="tune-edgeElasticity" aria-label="连接弹性" />
        <output id="tune-edgeElasticity-val"></output>
      </div>
      <div class="tuning-row">
        <label for="tune-idealEdgeLength">理想边长</label>
        <input type="range" id="tune-idealEdgeLength" aria-label="理想边长" />
        <output id="tune-idealEdgeLength-val"></output>
      </div>
      <button type="button" id="btn-reset-layout" class="detail-link" title="清空布局存档并从头重排">重置布局</button>
    </div>
  </aside>

  <aside id="dock-right" class="overlay">
    <div class="card" id="detail-card-wrap">
      <h2>节点详情</h2>
      <div id="detail-card"></div>
    </div>
  </aside>

  <footer id="statusbar" class="overlay">
    <div id="sb-left"></div>
    <div class="band-wrap">
      <div class="band" id="band"></div>
      <div class="band-cap" id="band-cap"></div>
    </div>
    <div id="sb-right">
      <span class="evt dim" id="evt"></span>
    </div>
  </footer>

  <div id="scan-notice" hidden></div>
  <div id="tooltip" aria-hidden="true"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
