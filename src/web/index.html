<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Module Graph</title>
</head>
<body data-theme="dark">
  <!-- 全屏仪器盘壳层（theme.html 定稿）：stage 打底，顶栏 / 左右坞 / 状态栏悬浮 -->
  <div id="stage">
    <div id="cy" aria-label="模块依赖图画布"></div>
  </div>

  <header id="topbar" class="overlay">
    <div class="brand"><span class="logo"></span>模块图谱<span class="sub">MODULE GRAPH</span></div>
    <div class="tools">
      <div class="search-group">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
        </svg>
        <input type="search" id="search-box" placeholder="搜索：路径 / 文件名" aria-label="搜索模块" />
      </div>
      <button type="button" id="btn-untested-only" class="tool-toggle" title="只显示未测模块（灰球）">只看未测</button>
      <div class="segmented" id="view-mode" role="group" aria-label="视图模式">
        <button type="button" id="btn-module-view" class="tool-toggle active" title="模块视图：文件球按功能类成堆，堆与堆之间连模块级边（默认）">模块视图</button>
        <button type="button" id="btn-file-view" class="tool-toggle" title="文件视图：全部文件（海报模式），或聚焦某一功能类的文件簇">文件视图</button>
      </div>
      <button type="button" id="btn-reset-layout" class="tool-toggle" title="清空布局存档并从头重排">重置布局</button>
      <button type="button" id="btn-reset" class="tool-toggle" title="缩放/平移复位到全图">重置视图</button>
    </div>
    <div class="spacer"></div>
    <button type="button" id="btn-theme" class="tool-toggle theme-btn" title="切换暗色仪器盘 / 亮色工作台（记忆于 localStorage）">亮色工作台</button>
    <div class="conn" id="conn"><span class="dot"></span><span id="conn-txt">连接中…</span></div>
  </header>

  <aside id="dock-left" class="overlay">
    <div class="card filter-card">
      <div class="legend-dots" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <div id="legend"></div>
    </div>
  </aside>

  <aside id="dock-right" class="overlay">
    <div class="card" id="detail-card-wrap">
      <h2>节点详情</h2>
      <div id="detail-card"></div>
    </div>
  </aside>

  <footer id="statusbar" class="overlay">
    <div id="sb-left"></div>
    <div class="band-wrap">
      <div class="band" id="band"></div>
      <div class="band-cap" id="band-cap"></div>
    </div>
    <div id="sb-right">
      <span class="evt dim" id="evt"></span>
    </div>
  </footer>

  <div id="scan-notice" hidden></div>
  <div id="tooltip" aria-hidden="true"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
